info:
  name: 02-Criar botão estrutural
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:3001/api/navegacoes-estruturais
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "cena_origem_id": "{{cena_origem_id}}",
        "cena_destino_id": "{{cena_destino_id}}",
        "rotulo": "Próxima página",
        "ordem_exibicao": 1
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
