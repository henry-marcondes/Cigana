info:
  name: 04-Reordenar botões estruturais
  type: http
  seq: 4

http:
  method: PATCH
  url: http://localhost:3001/api/navegacoes-estruturais/reordenar
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "cena_origem_id": "{{cena_origem_id}}",
        "ordem": [
          { "id": "{{navegacao_id_2}}" },
          { "id": "{{navegacao_id_1}}" }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
