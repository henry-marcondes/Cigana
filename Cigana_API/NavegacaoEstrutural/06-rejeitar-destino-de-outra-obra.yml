info:
  name: 06-Rejeitar destino de outra obra
  type: http
  seq: 6

http:
  method: POST
  url: http://localhost:3001/api/navegacoes-estruturais
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "cena_origem_id": "{{cena_origem_id}}",
        "cena_destino_id": "{{cena_outra_obra_id}}",
        "rotulo": "Destino inválido",
        "ordem_exibicao": 99
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
