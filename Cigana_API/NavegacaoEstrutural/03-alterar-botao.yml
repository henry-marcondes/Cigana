info:
  name: 03-Alterar botão estrutural
  type: http
  seq: 3

http:
  method: PUT
  url: http://localhost:3001/api/navegacoes-estruturais/{{navegacao_id}}
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "cena_destino_id": "{{cena_destino_id}}",
        "rotulo": "Capítulo seguinte"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true
