info:
  name: 01 - Criar Vídeo
  type: http

http:
  method: POST
  url: http://localhost:3001/api/cena-videos

  body:
    type: json
    data: |-
      {
        "cena_id": "ed1e8e6a-dd88-48a2-8161-0e7ce3841e05",
        "titulo": "Apresentação da Cultura Cigana",
        "legenda": "Vídeo introdutório sobre a cultura cigana.",
        "descricao": "Apresentação audiovisual utilizada na cena inicial.",
        "video_url": "Cigana/media/videos/video_1.mp4",
        "miniatura_url": "Cigana/media/videos/miniaturas/linux_1.png",
        "reproducao_automatica": false,
        "reproducao_em_loop": false,
        "ordem_exibicao": 1
      }

  headers:
    - name: Content-Type
      value: application/json

  assert:
    - status: 201
